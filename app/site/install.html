  <style>
    /* Minimal landing: the mark, three ways to read about it, one way in.
       Tokens and the logo's colours come from site.css. */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .landing {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 16px; text-align: center;
    }
    .landing .logo { width: 104px; height: 104px; display: block; }
    .landing h1 {
      margin: 20px 0 8px; font-size: clamp(38px, 7vw, 52px); font-weight: 600;
      letter-spacing: -.035em; line-height: 1;
    }
    .landing .sub { margin: 0; color: var(--dim); font-size: 15.5px; }

    .tiles { display: flex; gap: 14px; margin: 40px 0 34px; flex-wrap: wrap; justify-content: center; }
    .tile {
      width: 104px; padding: 18px 0 14px; border-radius: var(--r);
      background: var(--surface); border: 1px solid var(--line);
      color: var(--dim); text-decoration: none; font-size: 13.5px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: border-color .15s, color .15s, transform .15s;
    }
    .tile svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tile:hover, .tile:focus-visible { color: var(--ink); border-color: var(--amber); transform: translateY(-2px); }
    .tile:hover svg, .tile:focus-visible svg { stroke: var(--amber); }

    .enter {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 40px; border-radius: 999px; background: var(--amber);
      color: #14100a; font-weight: 600; font-size: 16px; text-decoration: none;
      transition: background .15s, transform .15s;
    }
    .enter:hover, .enter:focus-visible { background: var(--amber-hover); transform: translateY(-1px); }
    .enter svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .foot { padding: 0 16px 22px; text-align: center; color: var(--faint); font-size: 12.5px; }
    .foot a { color: var(--faint); }
    .foot a:hover { color: var(--dim); }
  </style>
</head>

<script>
(function () {
  // Service Worker for offline PWA, with the same auto-update handshake the
  // app page uses so a new deploy never gets stuck behind a stale cache.
  if ('serviceWorker' in navigator) {
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        reg.update().catch(function () {});
        function promote(w) {
          if (w && w.state === 'installed' && navigator.serviceWorker.controller) {
            w.postMessage('SKIP_WAITING');
          }
        }
        if (reg.waiting) promote(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (nw) nw.addEventListener('statechange', function () { promote(nw); });
        });
      }).catch(function () {});
    });
  }

  // The app URL resolves to app.html on published Pages, or index.html locally
  var targetAppUrl = window.location.pathname.endsWith('install.html') ? 'index.html' : 'app.html';
  document.querySelectorAll('[data-applink]').forEach(function (a) { a.href = targetAppUrl; });
}());
