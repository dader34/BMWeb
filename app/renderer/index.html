  <!-- GLOBAL CRASH HANDLER, before every app module so it sees them all.
       A script that throws during boot used to leave the splash on
       "starting engine" forever, with the only evidence in a console most
       users never open -- the offline exports have long injected their own
       version of this (core/offline-export.js), and the app itself deserves
       no less. During boot the error paints the splash status; afterwards
       it draws a small dismissible banner. Details stay in the console. -->
  <script>
    (function () {
      let banner = null;
      const show = (msg) => {
        const st = document.getElementById('splash-status');
        if (document.getElementById('splash') && st) {
          st.textContent = msg;
          st.style.color = '#ef6b6b';
          const bar = document.getElementById('splash-bar-fill');
          if (bar) bar.style.display = 'none';
          return;
        }
        if (!document.body) return;
        if (!banner) {
          banner = document.createElement('div');
          banner.style.cssText = 'position:fixed;left:50%;bottom:24px;'
            + 'transform:translateX(-50%);z-index:9999;'
            + 'max-width:min(560px,90vw);padding:10px 14px;border-radius:8px;'
            + 'background:var(--panel,#20242b);border:1px solid var(--red,#ef6b6b);'
            + 'color:var(--ink,#eef2f5);font-size:12.5px;line-height:1.5;'
            + 'box-shadow:0 8px 30px rgba(0,0,0,.45);cursor:pointer';
          banner.title = 'Click to dismiss. Details are in the console.';
          banner.onclick = () => { banner.remove(); banner = null; };
          document.body.appendChild(banner);
        }
        banner.textContent = '⚠ ' + msg;
      };
      window.addEventListener('error', (e) => {
        show((e.message || 'script error')
          + (e.filename
             ? ` (${e.filename.split('/').pop()}${e.lineno ? ':' + e.lineno : ''})`
             : ''));
      });
      window.addEventListener('unhandledrejection', (e) => {
        show('unhandled: '
          + ((e.reason && e.reason.message) || e.reason || 'promise rejected'));
      });
    }());
  </script>

    <nav class="breadcrumbs" id="crumbs"></nav>
    <!-- A screen's primary action, shown top-right on mobile the way the back
         arrow sits top-left. A screen registers it as an action with
         kind:'navAction' (e.g. the coding screen's Re-read); hidden when none.
         A direct topbar child so it survives .topbar-right being hidden on

    <button class="nav-action" id="nav-action" hidden></button>

         so a screen's remaining actions (Print, Clear filters, the shift row)

    <button class="nav-fn" id="nav-fn" hidden aria-label="Functions" title="Functions">&#402;</button>

  <!-- Name the product BEFORE the browser's first paint. The native shell
       injects window.bmacw at document start, so its absence means the web
       build. This cannot wait for app.js: the parser stalls for seconds on
       the big scripts below (the offline copy embeds megabytes of data) and
       the browser paints the splash in the meantime. -->
  <script>
    // THE NAME AND THE CHROME ARE TWO QUESTIONS, not one.
    //
    // BMacW is the macOS app -- the name is the pun. Everywhere else it is
    // BMWeb: in a browser, and in the Windows/Linux desktop build, which is
    // the same renderer in a WebView2/WebKitGTK window. So the host says what
    // it is called (window.bmacw.appName) and the browser, having no host at
    // all, is BMWeb by definition.
    //
    // Window controls are a separate matter: only the macOS build draws its
    // own traffic lights, because only it hides the real titlebar. A browser
    // has none to draw and the Photino window keeps its own, so both drop the
    // renderer's set.
    const IS_WEB = !window.bmacw;
    const APP_NAME = IS_WEB ? 'BMWeb' : (window.bmacw.appName || 'BMacW');
    const OWN_CHROME = !IS_WEB && window.bmacw.ownChrome !== false;
    if (APP_NAME !== 'BMacW') {
      document.title = APP_NAME;
      document.querySelector('.splash-name').textContent = APP_NAME;
      document.querySelector('.brand-name').textContent = APP_NAME;
      // the tagline follows the NAME, not the host: only the macOS build is
      // "for macOS", and a Windows window saying so is simply wrong
      document.querySelector('.splash-tag').textContent = IS_WEB
        ? 'BMW diagnostics in the browser'
        : 'BMW diagnostics';
    }
    if (!OWN_CHROME) {
      // nothing for these to drive: the window's own chrome is showing
      document.getElementById('win-controls').remove();
      document.documentElement.classList.add('no-chrome');
    }
    // Paint in the saved skin from the first frame, same reason as above.
    // core.js re-applies the full theme (translucency, dock icon) when it
    // loads; this only sets what CSS needs.
    try {
      const early = window.__bmacwSettings ||
        JSON.parse(localStorage.getItem('bmacw.settings') || '{}');
      if (early.theme && early.theme !== 'instrument') {
        document.documentElement.setAttribute('data-theme', early.theme);
      }
      document.documentElement.style.setProperty('--aero-opacity', '0.82');
    } catch { /* file:// can refuse localStorage; default skin then */ }
  </script>

  <script>
    // Service worker: register, and AUTO-UPDATE. A cache-first worker used to
    // serve stale HTML/CSS until you force-quit the installed PWA twice --
    // "it never refreshed". Now the worker is network-first for the app shell
    // (see sw.js), and this drives the update handshake: when a new worker is
    // found, tell it to activate immediately, and reload ONCE when it takes
    // control so the fresh UI shows without any manual restart.
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // check for an update on every launch
          reg.update().catch(() => {});
          const promote = (w) => w && w.state === 'installed'
            && navigator.serviceWorker.controller
            && w.postMessage('SKIP_WAITING');
          if (reg.waiting) promote(reg.waiting);
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (nw) nw.addEventListener('statechange', () => promote(nw));
          });
        }).catch(() => {});
      });
    }
  </script>
