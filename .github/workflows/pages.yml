# Publish the browser build to GitHub Pages.
#
# The web build is the same renderer as the macOS app with no server behind
# it: static JSON for every read, and Web Serial for the cable. See
# scripts/build-web.sh.
#
# Runs on a push to main that touches anything the build is made of, and can
# be triggered by hand. The generated tree is ~330 MB across ~42k files, so
# this is not a fast job -- most of the time is the artifact upload, not the
# build (the export itself is ~20s).
#
# No app is needed here: web_export.py falls back to data/chassis-config,
# committed for exactly this reason. Everything else is already a generated
# file in the repo.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'app/renderer/**'
      - 'data/**'
      - 'ecus/**'
      - 'tools/web_export.py'
      - 'scripts/build-web.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only for contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a running one -- a half-uploaded Pages
# artifact leaves the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand the committed data
        run: |
          set -euo pipefail
          # The generated JSON is committed gzipped only (38 MB against 573 MB
          # raw). web_export.py reads .json, so expand in place first. job-code
          # keeps BOTH: the exporter ships the .gz as-is and the browser
          # inflates it via Content-Encoding.
          for d in job-meta sgbd-tables inpa-ir; do
            find "data/$d" -name '*.json.gz' -print0 \
              | xargs -0 -r -P 4 -I{} gzip -dkf {}
          done
          echo "expanded: $(find data/job-meta data/sgbd-tables data/inpa-ir \
            -name '*.json' | wc -l) files"

      - name: Build the static site
        run: |
          set -euo pipefail
          # build-web.sh insists on a running app to resolve the chassis
          # config; here the exporter reads the committed cache instead, so
          # call the pieces directly rather than fighting that check.
          mkdir -p dist-web
          python3 tools/web_export.py --out dist-web
          cp -R app/renderer/. dist-web/
          # index.html already loads webshim.js -- both hosts need it.
          test -s dist-web/index.html
          grep -q webshim.js dist-web/index.html
          # A build that exported nothing must FAIL here, not deploy a shell
          # of a site: the first Pages run shipped 63 files and looked green.
          n=$(find dist-web/api/ecu -maxdepth 1 -type d | wc -l)
          echo "ecu directories: $n"
          test "$n" -gt 300

      - name: Pre-compress the large payloads
        run: |
          set -euo pipefail
          # faultinfo.js alone is 60 MB. Pages serves .gz with the right
          # Content-Encoding only if the original is absent, so keep both and
          # let the shim's .gz-sibling lookup do the choosing, exactly as the
          # macOS StaticHost does.
          find dist-web -maxdepth 1 -name '*.js' -size +1M -print0 \
            | xargs -0 -r -P 4 -I{} gzip -9 -k -f {}

      - name: Report what is being published
        run: |
          echo "size:  $(du -sh dist-web | cut -f1)"
          echo "files: $(find dist-web -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
