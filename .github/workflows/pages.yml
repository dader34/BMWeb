# Publish the browser build to GitHub Pages.
#
# The web build is the same renderer as the macOS app with no server behind
# it: static JSON for every read, and Web Serial for the cable. See
# scripts/build/build-web.sh.
#
# Runs on a push to main that touches anything the build is made of, and can
# be triggered by hand. The generated tree is ~330 MB across ~42k files, so
# this is not a fast job -- most of the time is the artifact upload, not the
# build (the export itself is ~20s).
#
# SPEED. Three things take the job from ~3.5 min to under 2: the wiring
# archives are fetched in the background from the first step (they depend on
# nothing before them and nothing needs them until the end); the fetched
# wiring set is cached by the dataset's revision; and the exported API tree
# (the per-car tree + web_export, ~50 s) is cached by the data pin and the
# exporter's own sources, so a renderer-only push restores it instead of
# rebuilding it. The data archive itself is still fetched every run (17 s):
# the tests and the docs copy read from it, and a partial cache of it would
# be a correctness risk for a small saving.
#
# No app is needed here: web_export.py falls back to data/chassis-config.
# That and every other generated file the build reads is NOT in the repo: it
# is one archive in the bmw-files dataset, pinned by checksum in
# scripts/setup/repo-data.sha256 and fetched as the first step. Regenerated
# data deploys when that checksum is committed.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'app/renderer/**'
      - 'scripts/setup/repo-data.sha256'
      - 'scripts/setup/fetch_repo_data.py'
      - 'tools/export/**'
      - 'tools/sgbd/ecu_tree.py'
      - 'scripts/build/build-web.sh'
      - 'scripts/build/ci-fetch-hf-data.sh'
      - 'scripts/build/fetch_wiring.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only for contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a running one -- a half-uploaded Pages
# artifact leaves the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build_single.js runs the browser exporter in a VM context
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache the npm download keyed on package-lock.json, so "Install dev
          # tooling" restores in seconds after the first run instead of
          # re-downloading eslint/prettier/typescript every time (~7 min)
          cache: npm

      # The wiring archives come from the bmw-files dataset; its current
      # revision keys their cache, so a republished set is picked up and an
      # unchanged one costs a restore instead of a minute's download.
      - name: Where the wiring comes from
        id: wiring-src
        run: |
          rev=$(curl -fsS --max-time 20 https://huggingface.co/api/datasets/CraigFf/bmw-files \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha","unknown"))' 2>/dev/null || echo unknown)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "bmw-files revision: $rev"

      - name: Restore the wiring archives
        id: wiring-cache
        uses: actions/cache@v4
        with:
          path: dist-web/data/wiring
          key: wiring-v1-${{ steps.wiring-src.outputs.rev }}-${{ hashFiles('scripts/build/fetch_wiring.py', 'scripts/build/ci-fetch-hf-data.sh') }}

      # Not cached: start the download now and let it run under everything
      # below. The step's shell exits but the process lives on until the job
      # ends; "Wiring diagrams" waits for it and reads its exit status.
      - name: Start the wiring fetch
        if: steps.wiring-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist-web
          nohup bash -c 'scripts/build/ci-fetch-hf-data.sh wiring; echo $? > wiring-fetch.status' \
            > wiring-fetch.log 2>&1 &
          disown
          echo "wiring fetch started in the background"

      - name: Fetch the generated data
        run: python3 scripts/setup/fetch_repo_data.py

      - name: Expand the fetched data
        run: |
          set -euo pipefail
          # The fetched data is gzipped. inpa-ir is read as .json by the tree
          # builder, so expand it in place first.
          find data/inpa-ir -name '*.json.gz' -print0 \
            | xargs -0 -r -P 4 -I{} gzip -dkf {}
          echo "expanded: $(find data/inpa-ir -name '*.json' | wc -l) files"

      # The exported API tree depends only on the fetched data (pinned by its
      # checksum) and the exporter's sources, so it is cached on exactly those.
      # A hit skips the export; a miss rebuilds it and the cache is saved when
      # the job succeeds.
      - name: Restore the exported API tree
        id: export-cache
        uses: actions/cache@v4
        with:
          path: dist-web-export
          key: export-v1-${{ hashFiles('scripts/setup/repo-data.sha256', 'tools/export/**', 'tools/sgbd/ecu_tree.py') }}

      # Always, cache or not: the verify tests below read data/chassis as
      # well as the export (a run that skipped this on a cache hit failed
      # at test_bestvm.js). ~30 s, overlapping the wiring download.
      - name: Assemble the per-car tree
        run: |
          set -euo pipefail
          # data/chassis/ is DERIVED and gitignored, so the runner has to build
          # it before anything can read it. It is what web_export and the
          # verify tests read.
          python3 tools/export/build_ecu_tree.py
          test -d data/chassis/E46

      # Lint + format + type gate. Install dev deps and run the same checks a
      # developer runs locally (npm run lint/format:check/typecheck).
      - name: Install dev tooling
        run: npm ci || npm install

      - name: Lint, format and type check
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run typecheck

      # NO DEPLOY OF UNTESTED CODE. These are the verify tests whose inputs
      # are all fetched above (plus the data/chassis tree assembled there): the VM
      # against captured telegrams, the wire framing, the VM bridge, the live .IPO
      # runtime and its captions, and -- critically -- the safety write-guard and its gate,
      # which keep an unrecognised job from ever reaching the car. They need no
      # app, no vendor tree and no cable.
      - name: Run the verify tests
        run: |
          set -euo pipefail
          node tools/verify/test_bestvm.js
          node tools/verify/test_transport.js
          node tools/verify/test_vmbridge.js
          node tools/verify/test_ir_i18n.js
          node tools/verify/test_writeguard.js
          node tools/verify/test_write_gate.js
          node tools/verify/test_ipo_runtime.js
          node tools/verify/test_flasher.js
          node tools/verify/test_global_collisions.js

      - name: Export the API tree
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The exporter reads the fetched chassis-config cache here (no
          # BMACW_PORT), so call the pieces directly.
          mkdir -p dist-web-export
          python3 tools/export/web_export.py --out dist-web-export

      - name: Build the static site
        run: |
          set -euo pipefail
          # The exported tree, restored or just built, hard-linked into place
          # (instant, and the cached copy is left as it is for the save).
          mkdir -p dist-web
          cp -al dist-web-export/. dist-web/
          if [ "${{ steps.export-cache.outputs.cache-hit }}" = "true" ]; then
            echo "exported tree: $(du -sh dist-web-export | cut -f1), restored from the cache"
          else
            echo "exported tree: $(du -sh dist-web-export | cut -f1), built"
          fi
          cp -R app/renderer/. dist-web/
          # index.html already loads the transport shim (core/webshim/) --
          # both hosts need it.
          test -s dist-web/index.html
          grep -q 'core/webshim/' dist-web/index.html
          # Version stamp, exactly as build-web.sh does it. This step calls
          # the exporter directly and skipped the stamp, so the deployed app
          # had no BMACW_VERSION and every beta report said app "dev".
          VERSION=$(node -p "require('./package.json').version")
          test -n "$VERSION"
          printf 'window.BMACW_VERSION="%s";\n' "$VERSION" > dist-web/version.js
          sed -i 's#<head>#<head>\n  <script src="version.js"></script>#' dist-web/index.html
          grep -q version.js dist-web/index.html
          echo "version: $VERSION"
          # Bundle the ~50 renderer scripts into one dist-web/bundle.js and
          # collapse index.html to a single tag (the dev source keeps its
          # individual tags). One request instead of fifty on the deployed site.
          node scripts/build/bundle-renderer.mjs dist-web dist-web/bundle.js
          node scripts/build/bundle-index.mjs dist-web/index.html
          grep -q bundle.js dist-web/index.html
          # A build that exported nothing must FAIL here, not deploy a shell
          # of a site: an earlier run shipped 63 files and looked green, and a
          # later one shipped archives that were present but hollow. Check
          # both: the archives exist, AND one holds real ECUs.
          n=$(find dist-web/api/chassis -name '*.chassis' | wc -l)
          echo "chassis archives: $n"
          test "$n" -ge 21
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('dist-web/api/chassis/E90.chassis'); e=[n for n in z.namelist() if n.endswith('.ecu')]; print(f'E90 holds {len(e)} .ecu'); sys.exit(0 if len(e)>40 else 1)"

      - name: Wiring diagrams
        run: |
          set -euo pipefail
          # The .wiring archives are built from a WDS release, which is 4.7 GB
          # and not in this repo, so they cannot be generated here. They are
          # pulled from the bmw-files dataset with the photographs dropped:
          # ~150 MB of diagrams and text. The photographs are fetched from the
          # same dataset at runtime (see WIRING_IMG_MIRRORS in
          # screens/wiring/archive.js) because a Pages site may hold 1 GB and
          # the complete archives are that alone.
          #
          # The download was started at the top of the job (or the set was
          # restored from the cache); here it is waited for and checked.
          #
          # Absent IS fatal: a site with no Wiring section shipped before this
          # step existed and nothing noticed.
          if [ "${{ steps.wiring-cache.outputs.cache-hit }}" != "true" ]; then
            echo "waiting for the wiring fetch..."
            for i in $(seq 1 240); do [ -f wiring-fetch.status ] && break; sleep 2; done
            cat wiring-fetch.log || true
            test -f wiring-fetch.status || { echo "the wiring fetch did not finish in time" >&2; exit 1; }
            status=$(cat wiring-fetch.status)
            test "$status" = "0" || { echo "the wiring fetch failed ($status)" >&2; exit 1; }
          else
            echo "wiring archives restored from the cache"
          fi
          n=$(find dist-web/data/wiring -name '*.wiring' | wc -l)
          echo "wiring archives: $n"
          test "$n" -ge 15   # one per covered chassis

      - name: Reference documents and the wiring VIN filter
        run: |
          set -euo pipefail
          # Both came with the fetched data and live outside app/renderer, so
          # the copy above does not bring them. Without the .docs the wiring
          # app's Components and Repair tabs say "No documents shipped";
          # without the index a VIN cannot narrow the diagrams.
          mkdir -p dist-web/data/docs dist-web/data/wiring
          cp data/docs/*.docs dist-web/data/docs/
          cp data/wiring-applicability.json.gz dist-web/data/wiring/applicability.json.gz
          n=$(find dist-web/data/docs -name '*.docs' | wc -l)
          echo "reference document archives: $n"
          test "$n" -ge 15   # one per covered chassis

      - name: Put the installer at the root
        run: |
          set -euo pipefail
          mv dist-web/index.html dist-web/app.html
          mv dist-web/install.html dist-web/index.html
          test -s dist-web/index.html

      - name: Report what is being published
        run: |
          echo "size:  $(du -sh dist-web | cut -f1)"
          echo "files: $(find dist-web -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
