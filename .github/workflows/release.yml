name: Release DMG

# Builds and packages the native macOS app into a drag-to-Applications DMG on a
# real macOS runner (the only place dotnet's macOS workload, codesign and
# hdiutil exist). Two ways in:
#   - push a tag  v*  -> builds and publishes a GitHub Release with the DMG
#   - run manually    -> builds and uploads the DMG as an artifact (no release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - name: Checkout with Git LFS (SGBDs and IPOs the app bundles)
        uses: actions/checkout@v4
        with:
          lfs: true

      # A v0.9.2 tag must build a 0.9.2 app. Check FIRST, before spending
      # 20 minutes building something misnamed.
      - name: Tag must match the app version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          ver=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/InpaMac.App/InpaMac.App.csproj)
          echo "tag=${GITHUB_REF_NAME}  csproj=${ver}"
          test "v${ver}" = "${GITHUB_REF_NAME}" || {
            echo "error: tag ${GITHUB_REF_NAME} does not match ApplicationDisplayVersion ${ver}" >&2
            exit 1
          }

      - name: Show the runner's default Xcode (macos-15 default is complete + recent enough)
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --find clang

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the macOS workload
        run: dotnet workload install macos

      - name: Fetch the ediabaslib engine source (gitignored; pinned commit)
        run: |
          git init -q vendor/ediabaslib-src
          git -C vendor/ediabaslib-src remote add origin https://github.com/uholeschak/ediabaslib.git
          git -C vendor/ediabaslib-src fetch -q --depth 1 origin b784044b45fd904e3b0f637a05174158be2c99ce
          git -C vendor/ediabaslib-src checkout -q FETCH_HEAD

      # The exporters are Python; a macOS runner ships one, but pin it so
      # this job and the Pages job agree.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The verify tests run under node; pin the same version Pages uses.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # THE APP BUNDLES dist-web. package-macos.sh copies it into
      # Contents/Resources/data, and dist-web is DERIVED and gitignored --
      # so a runner starts without it and the packaging step fails on a
      # clean checkout. Pages builds it in its own job; this needs its own
      # copy. Same three steps, same order.
      - name: Expand the committed data
        run: |
          set -euo pipefail
          find data/inpa-ir -name '*.json.gz' -print0 \
            | xargs -0 -r -P 4 -I{} gzip -dkf {}
          echo "expanded: $(find data/inpa-ir -name '*.json' | wc -l) files"

      - name: Assemble the per-car tree
        run: |
          set -euo pipefail
          python3 tools/export/build_ecu_tree.py
          test -d data/chassis/E46

      # NO RELEASE OF UNTESTED CODE. These are the verify tests whose inputs
      # are all in git (plus the data/chassis tree assembled above): the VM
      # against captured telegrams, the wire framing, the VM bridge, and the
      # IR interpreter. They need no app, no vendor tree and no cable.
      - name: Run the verify tests
        run: |
          set -euo pipefail
          node tools/verify/test_bestvm.js
          node tools/verify/test_transport.js
          node tools/verify/test_vmbridge.js
          node tools/verify/test_ir_render.js

      - name: Build the static site the app serves
        run: |
          set -euo pipefail
          mkdir -p dist-web
          python3 tools/export/web_export.py --out dist-web
          cp -R app/renderer/. dist-web/
          test -s dist-web/index.html
          grep -q webshim.js dist-web/index.html
          # A build that exported nothing must FAIL here, not package a
          # hollow app: same two checks as the Pages job, for the same
          # incident -- archives that exist AND one that holds real ECUs.
          n=$(find dist-web/api/chassis -name '*.chassis' | wc -l)
          echo "chassis archives: $n"
          test "$n" -ge 21
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('dist-web/api/chassis/E90.chassis'); e=[n for n in z.namelist() if n.endswith('.ecu')]; print(f'E90 holds {len(e)} .ecu'); sys.exit(0 if len(e)>40 else 1)"
          echo "dist-web: $(du -sh dist-web | cut -f1)"

      - name: Wiring diagrams
        run: |
          set -euo pipefail
          # ~150 MB of BMW schematics, built from a WDS release that is not
          # in this repo and published to the wiring-images repo by hand. The
          # app BUNDLES these (package-macos.sh copies them into
          # Contents/Resources), which is most of the DMG's size.
          #
          # A local dist-web/data/wiring may be far larger -- older or
          # uncompressed copies -- so size the DMG from what THIS step
          # downloads, not from a working tree.
          #
          # Absent IS fatal now: a DMG with no Wiring section already
          # shipped once (v0.9.1) and nothing in the pipeline noticed. If
          # the wiring release is genuinely meant to be skipped, delete this
          # step on purpose rather than letting it fail quietly.
          # (gh creates the --dir itself; no pre-mkdir, so a failed download
          # cannot leave an empty directory that passes later [ -d ] checks.)
          gh release download wiring-latest \
            --repo dader34/BMacW-wiring-images \
            --pattern '*.wiring' --dir dist-web/data/wiring
          n=$(find dist-web/data/wiring -name '*.wiring' | wc -l)
          echo "wiring archives: $n"
          test "$n" -ge 15   # one per covered chassis
          du -sh dist-web/data/wiring
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package the DMG
        run: bash scripts/build/package-macos.sh

      - name: Locate the built DMG
        id: dmg
        run: echo "path=$(ls dist-release/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      # v0.9.2 with everything aboard is ~350 MB. Missing wiring loses
      # ~150 MB and a hollow dist-web far more, so a small DMG is a broken
      # DMG even if every step above looked green.
      - name: DMG size floor
        run: |
          set -euo pipefail
          size=$(stat -f%z "${{ steps.dmg.outputs.path }}")
          echo "DMG: ${{ steps.dmg.outputs.path }} ($size bytes)"
          test "$size" -ge 300000000

      - name: Upload DMG as build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: BMacW-dmg
          path: dist-release/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The offline-zips workflow races this one to create the release
          # (both fire on the same tag). A bare `create` fails when it loses
          # -- exactly how v0.9.9 shipped without a DMG. Same guard as
          # release-web.yml: create only if absent, then upload either way.
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "Automated macOS build of ${{ github.ref_name }}. Unsigned: after install run  xattr -dr com.apple.quarantine /Applications/BMacW.app"
          gh release upload "${{ github.ref_name }}" "${{ steps.dmg.outputs.path }}" --clobber
