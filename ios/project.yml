# The iOS shell for BMWeb: a WKWebView carrying the web app, with a TCP
# socket bridged to the page for a WiFi OBD adapter (the THOR). Generate the
# Xcode project with `xcodegen` in this folder; pack the web app first with
# ./pack-web.sh.
name: BMWeb
options:
  bundleIdPrefix: com.bmweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  BMWebUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BMWebUITests]
    dependencies:
      - target: BMWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bmweb.flasher.uitests
        TEST_TARGET_NAME: BMWeb
  BMWeb:
    type: application
    platform: iOS
    sources:
      - path: BMWeb
        excludes:
          - "Web/**"
      - path: BMWeb/Web
        type: folder
        buildPhase: resources
    info:
      path: BMWeb/Info.plist
      properties:
        CFBundleDisplayName: BMWeb
        CFBundleName: BMWeb
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: BMWeb talks to the WiFi OBD adapter (and, for testing, an emulated DME on your Mac) over the local network.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets: [BMWebUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bmweb.flasher
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        CODE_SIGN_STYLE: Automatic
